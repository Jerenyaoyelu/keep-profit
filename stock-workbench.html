<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个股分析台</title>
<style>
:root{
  --bg:#0d1117; --panel:#151c24; --panel2:#1a222c; --line:#242e3a;
  --fg:#e6edf3; --muted:#8b97a6; --dim:#5d6a79;
  --red:#e5484d; --amber:#f5a524; --green:#35c07a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:14px;line-height:1.5}
body{padding-bottom:60px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.topbar{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2b3543,#1a222c);
  border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:#c9d4e0;cursor:pointer}
.topbar h1{font-size:15px;font-weight:650;margin:0;cursor:pointer}
.spacer{flex:1}
.stamp{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dotlive{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(53,192,122,.14)}
.dotlive.dead{background:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.14)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);
  padding:7px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{border-color:#3a4756;background:var(--panel2)}
.btn.primary{background:#e5484d1a;border-color:#e5484d55;color:#ff8a8d}
.btn.primary:hover{background:#e5484d26}
.btn.ghost{background:transparent}
.chip{border:1px solid var(--line);background:#ffffff08;color:var(--muted);
  padding:6px 11px;border-radius:16px;font-size:11.5px;cursor:pointer;user-select:none;transition:.16s}
.chip.on{background:#35c07a1a;border-color:#35c07a44;color:#6ee7a8}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);
  margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2:after{content:"";flex:1;height:1px;background:var(--line)}

/* 首页输入 */
.entry{margin-top:26px;padding:26px 24px;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(120% 160% at 0% 0%,rgba(76,154,255,.10),transparent 58%),var(--panel)}
.entry h3{margin:0 0 6px;font-size:21px;font-weight:750;letter-spacing:.4px}
.entry p.sub{margin:0 0 20px;color:var(--muted);font-size:12.5px}
.inputrow{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:10px}
.inp{background:#0f151c;border:1px solid var(--line);color:var(--fg);border-radius:11px;
  padding:13px 14px;font-size:14px;font-family:inherit;outline:none;width:100%}
.inp:focus{border-color:#3a4756}
.inp::placeholder{color:#4d5967}
.hintline{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hintline .t{font-size:11.5px;color:var(--dim)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.toggle button{border:0;background:transparent;color:var(--dim);padding:12px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.toggle button.on{background:#ffffff0d;color:var(--fg);font-weight:600}
.entry .go{margin-top:16px;display:flex;gap:10px;align-items:center}
.entry .go .btn{padding:12px 22px;font-size:13.5px;border-radius:11px}

/* 记录 */
.recs{margin-top:22px}
.rec{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel);margin-bottom:10px;cursor:pointer;transition:.15s}
.rec:hover{border-color:#3a4756;background:var(--panel2)}
.rec .code{font-size:15px;font-weight:700;letter-spacing:.4px}
.rec .name{font-size:12.5px;color:var(--muted)}
.rec .mid{flex:1;min-width:0}
.rec .px{font-size:15px;font-weight:650}
.rec .pct{font-size:12px}
.rec .badge{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.rec .badge.red{background:#e5484d1f;color:#ff8a8d;border:1px solid #e5484d40}
.rec .badge.amber{background:#f5a5241f;color:#ffc46b;border:1px solid #f5a52440}
.rec .badge.green{background:#35c07a1a;color:#6ee7a8;border:1px solid #35c07a3d}
.rec .ts{font-size:11px;color:var(--dim)}
.rec .x{color:var(--dim);font-size:12px;padding:4px}
.rec .x:hover{color:#ff8a8d}
.empty{color:var(--dim);font-size:12.5px;padding:16px 0}

/* 分析页 */
.shead{margin-top:20px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.shead .nm{font-size:24px;font-weight:800;letter-spacing:.5px}
.shead .cd{font-size:12.5px;color:var(--dim);letter-spacing:.6px}
.shead .px{font-size:26px;font-weight:800}
.shead .ch{font-size:13px}
.hero{margin-top:14px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.status{border-radius:16px;border:1px solid var(--line);padding:20px;
  background:radial-gradient(120% 140% at 0% 0%,rgba(229,72,77,.12),transparent 62%),var(--panel)}
.tagline{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.pulse{width:11px;height:11px;border-radius:50%;background:var(--red)}
.statename{font-size:27px;font-weight:800;letter-spacing:.6px;margin:8px 0 2px}
.statesub{font-size:12.5px;color:var(--muted)}
.action{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:13.5px;font-weight:600;line-height:1.6}
.action small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#0f151c;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-bottom:4px}
.kpi b{font-size:15px}

/* 趋势打分 */
.trow{padding:11px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.trow:first-child{border-top:0;padding-top:0}
.trow .lb{width:78px;font-size:12px;color:var(--muted);flex:none}
.trow .bar{flex:1;height:5px;border-radius:3px;background:#232b36;position:relative;overflow:hidden}
.trow .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.trow .vl{width:120px;text-align:right;font-size:12px;color:var(--fg);flex:none}
.verdict{margin-top:14px;padding:12px 14px;border-radius:11px;background:#0f151c;border:1px solid var(--line);font-size:12.5px;line-height:1.7}
.verdict b{color:#fff}

/* 价位 */
.track{position:relative;height:60px;margin:24px 4px 0;border-radius:10px;background:#1e2733}
.track .zone{position:absolute;top:0;bottom:0}
.pin{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;transform:translateX(-50%)}
.pin .lbl{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:10px;
  background:#000000a0;border:1px solid #ffffff33;padding:1px 6px;border-radius:5px;white-space:nowrap}
.marks{position:relative;height:40px;margin:6px 4px 0}
.mk{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--dim);text-align:center;white-space:nowrap}

/* 表格 */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;letter-spacing:.7px;color:var(--dim);text-align:left;padding:0 0 9px;font-weight:600}
td{padding:10px 0;border-top:1px solid var(--line);font-size:12.5px;vertical-align:top}

.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.mini{background:#0f151c;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mini i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-bottom:3px}
.mini b{font-size:13px}

.banner{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;font-size:12.5px;
  background:#f5a5241a;border:1px solid #f5a5243d;color:#ffc46b}
.banner.err{background:#e5484d1a;border-color:#e5484d40;color:#ff9a9d}

/* 持仓弹窗 */
.mask{position:fixed;inset:0;background:#000000a6;display:none;z-index:50;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.modal{width:min(480px,100%);background:var(--panel);border:1px solid #2b3543;border-radius:16px;padding:22px}
.modal h3{font-size:15px;margin:0 0 4px}
.modal p.tip{font-size:12px;color:var(--muted);margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
.field input{width:100%;background:#0f151c;border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.9}

@media(max-width:860px){
  .hero{grid-template-columns:1fr}
  .grid6{grid-template-columns:repeat(3,1fr)}
  .inputrow{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .inputrow{grid-template-columns:1fr}
  .shead .nm{font-size:20px}
  .shead .px{font-size:22px}
  .grid6{grid-template-columns:repeat(2,1fr)}
  .trow .vl{width:86px}
  .trow .lb{width:62px}
  td.hide-sm{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="logo" onclick="location.hash='#/'">Q</div>
    <h1 onclick="location.hash='#/'">个股分析台</h1>
    <div class="spacer"></div>
    <div class="stamp"><span class="dotlive" id="liveDot"></span><span id="stampTxt">—</span></div>
    <button class="btn ghost" onclick="location.hash='#/review'">复盘</button>
    <button class="btn ghost" id="btnHome" onclick="location.hash='#/'">全部记录</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="mask" id="maskPos">
  <div class="modal">
    <h3>持仓信息</h3>
    <p class="tip">只改持仓与成本，行情数据不用填——页面自己拉。</p>
    <div class="grid2">
      <div class="field"><label>是否持仓</label>
        <select id="pHold" class="inp" style="padding:9px 11px">
          <option value="no">没有持仓</option>
          <option value="yes">持有中</option>
        </select>
      </div>
      <div class="field"><label>持仓成本</label><input id="pCost" type="number" step="0.001" placeholder="如 27.716"></div>
      <div class="field"><label>持仓数量（股）</label><input id="pQty" type="number" step="1" placeholder="可选"></div>
      <div class="field"><label>该股占总资产 %</label><input id="pWeight" type="number" step="0.1" placeholder="如 30"></div>
    </div>
    <div class="foot">
      <button class="btn" onclick="UI.closePos()">取消</button>
      <button class="btn primary" onclick="UI.savePos()">保存并重算</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   个股分析台 v3
   结构：
     1) DATA   —— 行情接口（JSONP，无需后端）
     2) CALC   —— 指标与规则计算（纯函数，便于后续替换）
     3) STORE  —— 本地记录（localStorage）
     4) VIEW   —— 首页 / 分析页渲染
     5) UI     —— 路由与交互
   ========================================================= */

/* ---------------- 1) 行情接口 ---------------- */
function secidOf(code){
  var c=String(code).replace(/\D/g,"");
  if(c.length===5) c="0"+c;                 // 港股/其他补齐
  var first=c.charAt(0);
  var mkt=(first==="6"||first==="5"||first==="9"||first==="1")?1:0;  // 沪市=1，深市/北交所=0
  return mkt+"."+c;
}
var seq=0;
function jsonp(url){
  return new Promise(function(res,rej){
    var cb="__cb"+(++seq)+"_"+Math.floor(Math.random()*1e6);
    var sc=null,t=setTimeout(function(){ cl(); rej(new Error("接口超时")); },9000);
    function cl(){ try{delete window[cb];}catch(e){window[cb]=undefined;}
      if(sc&&sc.parentNode)sc.parentNode.removeChild(sc); clearTimeout(t); }
    window[cb]=function(d){ cl(); res(d); };
    sc=document.createElement("script");
    sc.src=url+(url.indexOf("?")>-1?"&":"?")+"cb="+cb;
    sc.onerror=function(){ cl(); rej(new Error("接口被拦截")); };
    document.head.appendChild(sc);
  });
}
function apiQuoteEM(secid){
  return jsonp("https://push2.eastmoney.com/api/qt/stock/get?secid="+secid+
    "&fltt=2&fields=f43,f44,f45,f46,f47,f48,f50,f57,f58,f60,f116,f162,f167,f168,f169,f170")
    .then(function(r){
      var q=r&&r.data;
      if(!q||!q.f43) throw new Error("EM quote empty");
      return q;
    });
}
/* 腾讯行情兜底：qt.gtimg.cn 返回全局变量赋值语句，适合直接注入 */
function apiQuoteTX(code){
  var tc=tcodeOf(code), vn="v_"+tc;
  return loadVar("https://qt.gtimg.cn/q="+tc, vn, true).then(function(){
    var raw=window._txraw; window._txraw=null;
    if(!raw) throw new Error("腾讯行情空");
    var f=raw.split("~");
    /* 腾讯字段：3 现价/4 昨收/5 今开/33 高/34 低/37 成交额(万)/38 换手/39 PE/45 总市值(亿)/46 PB/49 量比 */
    return {
      f58:f[1], f57:f[2], f43:+f[3], f60:+f[4], f46:+f[5],
      f44:+f[33], f45:+f[34], f168:+f[38], f50:+f[49],
      f48:(+f[37])*1e4, f116:(+f[45])*1e8, f162:+f[39], f167:+f[46]
    };
  });
}
function quoteSafe(secid,code){
  return apiQuoteEM(secid).catch(function(){ return apiQuoteTX(code); });
}
function tcodeOf(code){
  var c=String(code).replace(/\D/g,""); if(c.length===5)c="0"+c;
  var f=c.charAt(0);
  return ((f==="6"||f==="5"||f==="9"||f==="1")?"sh":"sz")+c;
}
/* 日K：东财前复权为主，腾讯为备；任一可用就能出分析 */
function apiKlineEM(secid){
  return jsonp("https://push2his.eastmoney.com/api/qt/stock/kline/get?secid="+secid+
    "&fields1=f1,f2,f3&fields2=f51,f53,f54,f55,f56,f57&klt=101&fqt=1&lmt=130&end=20500101")
    .then(function(r){
      if(!r||!r.data||!r.data.klines) throw new Error("EM kline empty");
      return {src:"东财·前复权",bars:r.data.klines.map(function(x){
        var p=x.split(",");
        return {d:p[0],c:+p[1],h:+p[2],l:+p[3],v:+p[4]};
      })};
    });
}
function loadVar(url,varname,rawMode){
  return new Promise(function(res,rej){
    var sc=document.createElement("script"), done=false;
    var t=setTimeout(function(){ if(!done){ done=true; if(sc.parentNode)sc.parentNode.removeChild(sc); rej(new Error("腾讯接口超时")); } },9000);
    sc.src=url;
    sc.onload=function(){
      if(done)return; done=true; clearTimeout(t);
      var v=window[varname];
      try{ delete window[varname]; }catch(e){ window[varname]=undefined; }
      if(sc.parentNode)sc.parentNode.removeChild(sc);
      if(rawMode){ window._txraw=v; if(v) res(v); else rej(new Error("腾讯行情空")); return; }
      if(v&&v.data) res(v); else rej(new Error("腾讯接口空数据"));
    };
    sc.onerror=function(){ if(done)return; done=true; clearTimeout(t); rej(new Error("腾讯接口被拦截")); };
    document.head.appendChild(sc);
  });
}
function apiKlineTX(code){
  var tc=tcodeOf(code), vn="_tk"+Math.floor(Math.random()*1e8);
  return loadVar("https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param="+tc+",day,,,130&_var="+vn, vn)
    .then(function(d){
      var ifc=d.data[tc]||d.data[code]||{};
      var arr=ifc.qfqday||ifc.day;
      if(!arr||!arr.length) throw new Error("腾讯无K线");
      return {src:"腾讯·不复权",bars:arr.map(function(r){
        return {d:r[0],c:+r[2],h:+r[3],l:+r[4],v:+r[5]};
      })};
    });
}
function klineSafe(secid,code){
  return apiKlineEM(secid).catch(function(){ return apiKlineTX(code); });
}
function apiFlow(secid){
  return jsonp("https://push2.eastmoney.com/api/qt/stock/fflow/kline/get?secid="+secid+
    "&fields1=f1,f2,f3,f7&fields2=f51,f52&klt=101&lmt=25");
}
function pullStock(code){
  var secid=secidOf(code);
  return Promise.all([quoteSafe(secid,code),klineSafe(secid,code),apiFlow(secid).catch(function(){return null;})]).then(function(r){
    var q=r[0], ks=r[1], fl=r[2]&&r[2].data;
    if(!q||!q.f43) throw new Error("没有这个代码的行情");
    if(!ks||!ks.bars||!ks.bars.length) throw new Error("没有历史K线");
    var bars=ks.bars;
    var flows=(fl&&fl.klines)?fl.klines.map(function(x){
      var p=x.split(","); return {d:p[0],net:+p[1]/1e8};
    }).filter(function(f){return !isNaN(f.net)}):[];
    var now=new Date();
    return {
      code:q.f57||String(code), name:q.f58||"",
      price:+q.f43, prevClose:+q.f60, open:+q.f46, high:+q.f44, low:+q.f45,
      amount:+(q.f48/1e8).toFixed(2), volumeRatio:+q.f50, turnover:+q.f168,
      pe:+q.f162, pb:+q.f167, mktcap:+(q.f116/1e8).toFixed(2),
      barSrc:ks.src,
      ts:now.getTime(),
      tsl:now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate())+" "+p2(now.getHours())+":"+p2(now.getMinutes()),
      bars:bars, flows:flows
    };
  });
}
function p2(n){return String(n).padStart(2,"0");}

/* ---------------- 2) 计算 ---------------- */
function sma(arr,n,at){ if(at===undefined)at=arr.length-1; if(at<n)return null;
  var s=0; for(var i=at-n+1;i<=at;i++)s+=arr[i]; return s/n; }
function ema(arr,n){
  var k=2/(n+1), out=[], prev=null;
  for(var i=0;i<arr.length;i++){
    if(prev===null) prev=arr[i]; else prev=arr[i]*k+prev*(1-k);
    out.push(prev);
  }
  return out;
}
function macd(closes){
  if(closes.length<35) return null;
  var e12=ema(closes,12), e26=ema(closes,26);
  var diff=closes.map(function(_,i){return e12[i]-e26[i];});
  var dea=ema(diff,9);
  var hist=diff.map(function(v,i){return v-dea[i];});
  return {diff:diff,dea:dea,hist:hist,
    d:diff[diff.length-1],e:dea[dea.length-1],h:hist[hist.length-1],
    prevH:hist[hist.length-2]};
}
function rsi(closes,n){
  if(closes.length<n+1) return null;
  var g=0,l=0;
  for(var i=closes.length-n;i<closes.length;i++){
    var d=closes[i]-closes[i-1]; if(d>=0)g+=d; else l-=d;
  }
  if(l===0) return 100;
  return 100-100/(1+(g/n)/(l/n));
}

function fl(v){ return (v===null||v===undefined||isNaN(v))?"—":((v>0?"+":"")+Number(v).toFixed(2)+" 亿"); }

/* 核心：把行情算成结论 —— 只依赖数组，方便以后加新指标 */
function analyze(st, hold){
  var bars=st.bars, closes=bars.map(function(b){return b.c});
  var n=closes.length-1, price=st.price;

  var ma5=sma(closes,5), ma10=sma(closes,10), ma20=sma(closes,20), ma60=sma(closes,60);
  var m=macd(closes), r=rsi(closes,14);

  var lo20=Math.min.apply(null,bars.slice(-20).map(function(b){return b.l})),
      hi20=Math.max.apply(null,bars.slice(-20).map(function(b){return b.h})),
      lo60=Math.min.apply(null,bars.slice(-60).map(function(b){return b.l})),
      hi60=Math.max.apply(null,bars.slice(-60).map(function(b){return b.h}));
  var pos60=(price-lo60)/(hi60-lo60)*100;
  var mom20=(n>=20)?(price/closes[n-20]-1):0;

  var v5=sma(bars.map(function(b){return b.v}),5), v20=sma(bars.map(function(b){return b.v}),20);
  var vr520=(v20&&v5)?v5/v20:1;

  /* 资金流历史接口不稳，条数不足就置空，宁可不给也不编 */
  var flow1=st.flows.length?st.flows[st.flows.length-1].net:null;
  var flow5=null,flow20=null;
  if(st.flows.length>=5){ flow5=0; st.flows.slice(-5).forEach(function(f){flow5+=f.net}); }
  if(st.flows.length>=20){ flow20=0; st.flows.slice(-20).forEach(function(f){flow20+=f.net}); }

  /* --- 打分：每一项给出方向与强度，便于解释 --- */
  var items=[], score=0;
  function push(label,val,dir,note){
    items.push({label:label,val:val,dir:dir,note:note});
    score+=val;
  }
  var dirMA = (ma20&&ma60)?(ma20>ma60?1:-1):0;
  push("均线结构", dirMA*2, dirMA,
    ma20&&ma60 ? ("MA20 "+(ma20>ma60?">":"<")+" MA60，"+(ma20>ma60?"中期多头":"中期空头"))
               : "均线数据不足");

  var dirP = (ma20)?(price>ma20?1:-1):0;
  push("价格位置", dirP*2, dirP,
    ma20 ? ("现价"+(price>ma20?"站上":"跌破")+"MA20 "+(ma20).toFixed(2)) : "—");

  var dirH = m?(m.h>0?1:-1):0;
  push("MACD", dirH*1.5, dirH,
    m ? ("柱 "+(m.h>0?"+":"")+m.h.toFixed(3)+(m.h>m.prevH?" 且走强":" 且走弱")) : "数据不足");

  var dirF = (flow5===null)
      ? (flow1===null?0:((flow1>0.3)?1:((flow1<-0.3)?-1:0)))
      : ((flow5>0.5)?1:(flow5<-0.5?-1:0));
  push("资金方向", dirF*1.5, dirF,
      flow1===null ? "资金数据暂缺（接口异常），本项未计入评分"
      : flow5===null ? ("主力今日 "+fl(flow1)+"，5/20日历史不可用，按当日方向判")
                   : ("主力 5 日 "+fl(flow5)));

  var dirM = (mom20>0.02)?1:(mom20<-0.02?-1:0);
  push("20日动量", dirM*1, dirM, "近 20 日 "+(mom20>0?"+":"")+(mom20*100).toFixed(1)+"%");

  var dirV = (vr520>1.25&&mom20>0)?1:((vr520>1.25&&mom20<0)?-1:0);
  push("量能配合", dirV*1, dirV, "5日均量/20日均量 = "+vr520.toFixed(2));

  var label, level, sub;
  if(score>=4){ label="偏多"; level="green"; sub="中期结构向上，回调是机会不是风险"; }
  else if(score<=-4){ label="偏空"; level="red"; sub="中期结构向下，反弹是减仓窗口"; }
  else { label="震荡"; level="amber"; sub="多空力量接近，等方向选出来再动"; }

  /* --- 关键价位 --- */
  var levels={
    strength:hi20, support:lo20, monthLow:lo60, monthHigh:hi60,
    ma20:ma20, ma60:ma60,
    cost:(hold&&+hold.cost>0)?+hold.cost:null
  };

  /* --- 操作建议：按持仓与否分别给 --- */
  var adv;
  if(hold&&hold.held){
    var cost=+hold.cost||price;
    var pnl=(price-cost)/cost;
    if(score<=-4){
      adv={
        main:"防守优先：反弹减仓",
        detail:"趋势偏空，别等回本。反弹到 MA20 "+(ma20?ma20.toFixed(2):"—")+" 附近减 1/3；有效跌破 "+
               lo20.toFixed(2)+"（20日低）再减一档。",
        cond:"减仓触发：反弹触及 "+(ma20?ma20.toFixed(2):"—")+" / 或收盘破 "+lo20.toFixed(2),
        risk:"失效条件：站回 MA20 且主力 3 日净流入转正，说明判断错了，停止减仓"
      };
    }else if(score>=4){
      adv={
        main:"持有，回踩可加",
        detail:"结构仍向上。现价距成本 "+(pnl>0?"+":"")+(pnl*100).toFixed(1)+"%，别在冲高时追加；"+
               "回踩 MA20 "+(ma20?ma20.toFixed(2):"—")+" 不破可加一次。",
        cond:"加仓触发：回踩 "+(ma20?ma20.toFixed(2):"—")+" 且当日不破、成交额不放大下跌",
        risk:"失效条件：收盘跌破 "+(ma60?ma60.toFixed(2):lo60.toFixed(2))+"（MA60），趋势转弱即离场"
      };
    }else{
      adv={
        main:"持有观察，不加不减",
        detail:"现在是震荡区间，位置在 "+pos60.toFixed(0)+"%（60日区间）。你的成本 "+(cost).toFixed(3)+
               "，浮亏/浮盈 "+(pnl*100).toFixed(1)+"%。区间里频繁操作只会交手续费。",
        cond:"上破 "+(hi20.toFixed(2))+" 或 下破 "+lo20.toFixed(2)+" 再动手",
        risk:"失效条件：若跌破 "+lo20.toFixed(2)+" 且主力连续 2 日流出，按止损处理"
      };
    }
  }else{
    if(score>=4){
      adv={
        main:"可以找位置进，但别追高",
        detail:(flow5!==null&&flow5>0?"趋势向上且资金配合。":"趋势向上。")+"现价在 60 日区间的 "+pos60.toFixed(0)+"% 位置，追高的性价比一般，"+
               "等回踩 MA20 "+(ma20?ma20.toFixed(2):"—")+" 再分批。",
        cond:"进场触发：回踩 "+(ma20?ma20.toFixed(2):"—")+" 站稳，或突破 "+hi20.toFixed(2)+" 放量",
        risk:"失效条件：收盘失守 "+(ma60?ma60.toFixed(2):lo60.toFixed(2))+"，多头结构破坏，不进"
      };
    }else if(score<=-4){
      adv={
        main:"不进场",
        detail:"下跌趋势里抄底胜率最低——这正是你说的“抄在半山腰”。等结构修复："+
               "站上 MA20 "+(ma20?ma20.toFixed(2):"—")+" 且主力资金转净流入，再谈。",
        cond:"观察信号：收盘站上 MA20 且 5 日主力净流入转正",
        risk:"现在进场的风险：反弹到 "+hi20.toFixed(2)+" 附近就遇阻回落，重复一次半山腰"
      };
    }else{
      adv={
        main:"等区间方向，不猜",
        detail:"震荡区间，上下沿清楚：上沿 "+hi20.toFixed(2)+"、下沿 "+lo20.toFixed(2)+
               "。突破上沿放量才追，跌破下沿就不做。",
        cond:"进场触发：放量突破 "+hi20.toFixed(2)+"，或回踩 "+lo20.toFixed(2)+" 出现缩量止跌",
        risk:"失效条件：跌破 "+lo20.toFixed(2)+"，区间下移，等新低点重新标定"
      };
    }
  }

  return {
    ma:{ma5:ma5,ma10:ma10,ma20:ma20,ma60:ma60},
    macd:m, rsi:r,
    lo20:lo20,hi20:hi20,lo60:lo60,hi60:hi60,pos60:pos60,mom20:mom20,vr520:vr520,
    flow1:flow1,flow5:flow5,flow20:flow20,
    items:items,score:score,label:label,level:level,sub:sub,
    levels:levels,adv:adv
  };
}

var K="stock_workbench_v3";
function loadDB(){
  try{ var o=JSON.parse(localStorage.getItem(K)||"{}"); return o&&o.records?o:{records:[]}; }
  catch(e){ return {records:[]}; }
}
function saveDB(db){ try{ localStorage.setItem(K,JSON.stringify(db)); }catch(e){} }
var DB=loadDB();
/* B8：每次分析都把结论钉成一条可回溯的快照（同一交易日覆盖，最多留 60 条） */
function snapRecord(rec){
  var st=rec.stock,a=rec.analysis; if(!st||!a||!st.bars||!st.bars.length) return;
  var d=st.bars[st.bars.length-1].d;
  var snap={d:d,ts:Date.now(),price:st.price,score:a.score,label:a.label,level:a.level,
            ma20:a.ma.ma20,lo20:a.lo20,hi20:a.hi20,lo60:a.lo60};
  rec.snaps=rec.snaps||[];
  var hit=-1; rec.snaps.forEach(function(x,k){ if(x.d===d) hit=k; });
  if(hit>=0) rec.snaps[hit]=snap; else rec.snaps.push(snap);
  if(rec.snaps.length>60) rec.snaps=rec.snaps.slice(-60);
}
function upsert(rec){
  snapRecord(rec);
  var i=DB.records.findIndex(function(x){return x.code===rec.code});
  if(i>=0) DB.records[i]=rec; else DB.records.unshift(rec);
  if(DB.records.length>80) DB.records=DB.records.slice(0,80);
  saveDB(DB);
}


/* ---------------- 3.5) 复盘 B8：给过去的建议对答案 ---------------- */
var KCACHE={};
function bucketOf(sc){ return sc>=4?"bull":sc<=-4?"bear":"flat"; }
function bucketName(b){ return {bull:"偏多",bear:"偏空",flat:"震荡"}[b]; }
function fwdAt(bars,d,n){
  var i=-1,k; for(k=0;k<bars.length;k++){ if(bars[k].d===d){ i=k; break; } }
  if(i<0) return null;
  var j=i+n; if(j>=bars.length) return null;
  var path=bars.slice(i+1,j+1);
  var hi=-1e9,lo=1e9;
  path.forEach(function(b){ if(b.h>hi)hi=b.h; if(b.c<lo)lo=b.c; });
  return {ret:bars[j].c/bars[i].c-1, hi:hi, lo:lo, n:j-i, bar:bars[j]};
}
function isHit(b,r){
  if(!r) return null;
  if(b==="bull") return r.ret>0;
  if(b==="bear") return r.ret<0;
  return Math.abs(r.ret)<=0.03;
}
function collectReview(){
  var recs=(DB.records||[]).filter(function(r){ return r.snaps&&r.snaps.length; });
  var jobs=recs.map(function(r){
    if(KCACHE[r.code]) return Promise.resolve({rec:r,bars:KCACHE[r.code]});
    return klineSafe(secidOf(r.code),r.code).then(function(ks){
      KCACHE[r.code]=ks.bars; return {rec:r,bars:ks.bars,src:ks.src};
    }).catch(function(){ return {rec:r,bars:null}; });
  });
  return Promise.all(jobs).then(buildReview);
}
function buildReview(list){
  var rows=[];
  list.forEach(function(job){
    var r=job.rec, bars=job.bars;
    (r.snaps||[]).forEach(function(sn){
      var b=bucketOf(sn.score);
      var r3=bars?fwdAt(bars,sn.d,3):null, r5=bars?fwdAt(bars,sn.d,5):null, r10=bars?fwdAt(bars,sn.d,10):null;
      rows.push({code:r.code,name:(r.stock&&r.stock.name)||r.code,d:sn.d,price:sn.price,
        score:sn.score,label:sn.label,bucket:b,ma20:sn.ma20,lo20:sn.lo20,
        r3:r3,r5:r5,r10:r10,hit:isHit(b,r5),
        bounce:r5&&sn.ma20?r5.hi>=sn.ma20:null,
        broke:r5&&sn.lo20?r5.lo<sn.lo20:null,
        barsReady:!!bars});
    });
  });
  rows.sort(function(a,b){ return a.d<b.d?1:a.d>b.d?-1:0; });
  var agg={bull:{n:0,h:0,r3:0,r5:0,r10:0,n3:0,n5:0,n10:0},
           bear:{n:0,h:0,r3:0,r5:0,r10:0,n3:0,n5:0,n10:0},
           flat:{n:0,h:0,r3:0,r5:0,r10:0,n3:0,n5:0,n10:0}};
  rows.forEach(function(x){
    var a=agg[x.bucket]; a.n++;
    if(x.hit===true) a.h++;
    if(x.r3){a.r3+=x.r3.ret;a.n3++;}
    if(x.r5){a.r5+=x.r5.ret;a.n5++;}
    if(x.r10){a.r10+=x.r10.ret;a.n10++;}
  });
  return {rows:rows,agg:agg};
}

function pct(n,d){ d=d===undefined?2:d; if(n===null||isNaN(n))return "—";
  return (n>0?"+":"")+(Number(n)*100).toFixed(d)+"%"; }
function esc(s){ return String(s||"").replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]}); }

  var bearRows=rows.filter(function(x){return x.bucket==="bear"&&x.r5});

      '<td class="num">'+pn(x.r10&&x.r10.ret)+'</td>'+

  }).join("");

  $("app").innerHTML=''+

      '样本少的时候结论很脆，别当成规律。<br>'+
      '偏空样本里，5 日内出现过反弹到 MA20 的：<b style="color:#ffc46b">'+bounceCnt+'/'+bearRows.length+'</b>；'+

    '</div>'+

function recCard(r){
  var lv=r.analysis?r.analysis.level:"amber";
  var lbl=r.analysis?r.analysis.label:"—";
  var cls=lv==="red"?"red":lv==="green"?"green":"amber";
  var ch=r.stock?((r.stock.price-r.stock.prevClose)/r.stock.prevClose):null;
  return '<div class="rec" data-code="'+r.code+'">'+
    '<div><div class="code num">'+r.code+'</div><div class="name">'+esc(r.stock&&r.stock.name)+'</div></div>'+
    '<div class="mid"><div class="px num">'+(r.stock?fx(r.stock.price,2):"—")+' <span class="pct" style="color:'+(ch>=0?"#35c07a":"#ff7b7f")+'">'+pct(ch,2)+'</span></div>'+
      '<div class="ts">'+esc(r.stock&&r.stock.tsl)+(r.hold&&r.hold.held?' · 持仓':'')+'</div></div>'+
    '<span class="badge '+cls+'">'+lbl+'</span>'+
    '<span class="x" data-del="'+r.code+'">删</span></div>';
}

function viewStock(rec,loading,err){
  if(loading){
    $("app").innerHTML='<div class="card" style="margin-top:20px"><h2>'+esc(rec.code)+'</h2>'+
      '<div style="color:#8b97a6;font-size:13px">正在拉取行情与历史数据…</div></div>';
    return;
  }
  if(err){
    $("app").innerHTML='<div class="card" style="margin-top:20px"><h2>'+esc(rec.code)+'</h2>'+
      '<div class="banner err" style="display:block;margin-top:0">'+esc(err)+'</div>'+
      '<div style="margin-top:14px"><button class="btn" onclick="location.hash=\'#/\'">返回</button></div></div>';
    return;
  }

  var st=rec.stock, a=rec.analysis, hold=rec.hold||{held:false};
  var ch=(st.price-st.prevClose)/st.prevClose;
  var mca=a.level==="red"?"#ff7b7f":a.level==="amber"?"#ffc46b":"#6ee7a8";
  var bga={red:"radial-gradient(120% 140% at 0% 0%,rgba(229,72,77,.13),transparent 62%),#151c24",
           amber:"radial-gradient(120% 140% at 0% 0%,rgba(245,165,36,.11),transparent 62%),#151c24",
           green:"radial-gradient(120% 140% at 0% 0%,rgba(53,192,122,.11),transparent 62%),#151c24"}[a.level];

  var detail=[
    ["开盘",fx(st.open,2)],["最高",fx(st.high,2)],["最低",fx(st.low,2)],
    ["成交额",fx(st.amount,2)+" 亿"],["量比",fx(st.volumeRatio,2)],["换手",fx(st.turnover,2)+"%"],
    ["MA5",fx(a.ma.ma5,2)],["MA20",fx(a.ma.ma20,2)],["MA60",fx(a.ma.ma60,2)],
    ["RSI(14)",fx(a.rsi,1)],["PE / PB",fx(st.pe,1)+" / "+fx(st.pb,2)],["总市值",fx(st.mktcap,0)+" 亿"],
    ["20日低",fx(a.lo20,2)],["20日高",fx(a.hi20,2)],["60日低",fx(a.lo60,2)],
    ["60日高",fx(a.hi60,2)],["60日位置",fx(a.pos60,0)+"%"],["资金 1/5/20日", fl(a.flow1)+" / "+fl(a.flow5)+" / "+fl(a.flow20)]
  ];

  var rows=a.items.map(function(it){
    var w=Math.min(Math.abs(it.val)/2*100,100);
    var col=it.val>0?"#35c07a":(it.val<0?"#e5484d":"#5d6a79");
    return '<div class="trow"><div class="lb">'+it.label+'</div>'+
      '<div class="bar"><i style="width:'+w+'%;background:'+col+'"></i></div>'+
      '<div class="vl num" title="'+esc(it.note)+'">'+(it.val>0?"+":"")+it.val+'</div></div>';
  }).join("");

  /* 价位轨道：以 60 日区间为轴 */
  var LO=Math.min(a.lo60, st.price)*0.985, HI=Math.max(a.hi60, st.price)*1.015;
  function px(v){ return Math.max(0,Math.min(100,(v-LO)/(HI-LO)*100)); }
  var marks=[];
  if(a.levels.cost) marks.push([a.levels.cost,"成本"]);
  marks.push([a.lo20,"20日低"],[a.hi20,"20日高"]);
  if(a.ma.ma20) marks.push([a.ma.ma20,"MA20"]);
  if(a.ma.ma60) marks.push([a.ma.ma60,"MA60"]);
  marks.sort(function(x,y){return x[0]-y[0]});
  var lastP=-99, mhtml=marks.map(function(m){
    var p=px(m[0]), clash=Math.abs(p-lastP)<10; lastP=p;
    return '<div class="mk" style="left:'+p+'%;top:'+(clash?"18px":"0px")+'">'+fx(m[0],2)+
      '<br><span style="color:#4a5666">'+m[1]+'</span></div>';
  }).join("");

  var holdBlock = hold.held&&hold.cost>0 ? (function(){
    var pnl=(st.price-hold.cost)/hold.cost;
    var val=hold.qty>0?st.price*hold.qty:null;
    return '<div class="card pos"><h2>你的持仓</h2>'+
      '<div style="font-size:24px;font-weight:800;margin:2px 0 10px;color:'+(pnl>=0?"#35c07a":"#ff7b7f")+'">'+
        (pnl>=0?"+":"")+(pnl*100).toFixed(2)+'%'+
        '<small style="font-size:12px;color:#8b97a6;margin-left:8px">成本 '+fx(hold.cost,3)+'</small></div>'+
      (val?'<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dashed #232b36"><span style="color:#8b97a6;font-size:12.5px">持仓市值</span><b class="num">'+fx(val,0)+' 元</b></div>':'')+
      (hold.weight?'<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dashed #232b36"><span style="color:#8b97a6;font-size:12.5px">占总资产</span><b class="num">'+fx(hold.weight,1)+'%</b></div>':'')+
      '<button class="btn" style="margin-top:12px" onclick="UI.openPos()">修改持仓</button></div>';
  })() : '<div class="card pos"><h2>你的持仓</h2><div style="color:#8b97a6;font-size:12.5px;line-height:1.8">未设置持仓。<br>设了成本和数量后，才能算出浮亏与仓位风险。</div><button class="btn" style="margin-top:12px" onclick="UI.openPos()">设置持仓</button></div>';

  $("app").innerHTML=
  '<div class="shead"><div><div class="nm">'+esc(st.name)+'</div><div class="cd num">'+esc(st.code)+' · '+esc(st.tsl)+'</div></div>'+
    '<div class="spacer" style="flex:1"></div>'+
    '<div style="text-align:right"><div class="px num" style="color:'+(ch>=0?"#35c07a":"#ff7b7f")+'">'+fx(st.price,2)+'</div>'+
    '<div class="ch" style="color:'+(ch>=0?"#35c07a":"#ff7b7f")+'">'+pct(ch,2)+'</div></div>'+
    '<button class="btn" onclick="UI.refresh()">刷新</button></div>'+

  '<div class="banner" id="banner"></div>'+

  '<div class="hero">'+
    '<div class="status" style="background:'+bga+'">'+
      '<div class="tagline"><span class="pulse" style="background:'+mca+'"></span><span>趋势判断 · 综合评分 '+a.score+'</span></div>'+
      '<div class="statename" style="color:'+mca+'">'+a.label+'</div>'+
      '<div class="statesub">'+esc(a.sub)+'</div>'+
      '<div class="action" style="background:'+mca+'14;border:1px solid '+mca+'33;color:'+mca+'">'+esc(a.adv.main)+
        '<small>'+esc(a.adv.detail)+'</small></div>'+
      '<div class="kpis" style="margin-top:14px">'+
        '<div class="kpi"><i>主力今日 / 5日</i><b class="num">'+fl(a.flow1)+' <span style="color:#5d6a79">/</span> '+fl(a.flow5)+'</b></div>'+
        '<div class="kpi"><i>60日区间位置</i><b class="num">'+fx(a.pos60,0)+'%</b></div>'+
      '</div>'+
    '</div>'+
    holdBlock+
  '</div>'+

  '<div class="card" style="margin-top:16px"><h2>五维打分 · 分数怎么来的</h2>'+rows+
    '<div class="verdict">'+a.items.map(function(it){return '<b>'+it.label+'：</b>'+esc(it.note)}).join('　·　')+'</div></div>'+

  '<div class="card" style="margin-top:16px"><h2>关键价位</h2>'+
    '<div class="track">'+
      '<div class="zone" style="left:0;width:'+px(a.lo20)+'%;background:#5a2427"></div>'+
      '<div class="zone" style="left:'+px(a.lo20)+'%;width:'+(px(a.hi20)-px(a.lo20))+'%;background:#3a4656"></div>'+
      '<div class="zone" style="left:'+px(a.hi20)+'%;right:0;background:#1f6b45"></div>'+
      '<div class="pin" style="left:'+px(st.price)+'%"><span class="lbl">'+fx(st.price,2)+'</span></div>'+
    '</div>'+
    '<div class="marks">'+mhtml+'</div>'+
    '<div style="color:#5d6a79;font-size:11px;margin-top:6px">轨道按近 60 日区间绘制：红＝20 日低点下方，灰＝区间内，绿＝20 日高点上方。</div>'+
  '</div>'+

  '<div class="card" style="margin-top:16px"><h2>操作建议清单</h2>'+
    '<table><tbody>'+
      '<tr><td style="width:74px;color:#5d6a79">主建议</td><td style="font-weight:600">'+esc(a.adv.main)+'</td></tr>'+
      '<tr><td style="color:#5d6a79">触发条件</td><td>'+esc(a.adv.cond)+'</td></tr>'+
      '<tr><td style="color:#5d6a79">失效条件</td><td>'+esc(a.adv.risk)+'</td></tr>'+
      '<tr><td style="color:#5d6a79">仓位提醒</td><td>'+(hold.held?(hold.weight&&hold.weight>30?'该股占总资产 '+fx(hold.weight,1)+'%，已属重仓——任何加仓都先问“跌 20% 我扛不扛得住”。':'仓位 '+(hold.weight?fx(hold.weight,1)+'%':'未填')+'，注意单票风险。'):'未持仓，先算好最大可亏金额再决定买多少。')+'</td></tr>'+
    '</tbody></table></div>'+

  '<div class="card" style="margin-top:16px"><h2>盘面明细</h2><div class="grid6">'+
    detail.map(function(d){return '<div class="mini"><i>'+d[0]+'</i><b class="num">'+d[1]+'</b></div>'}).join('')+
  '</div></div>'+

  '<footer>口径：均线与指标按日线（前复权）计算；趋势判断为规则打分，非预测，不构成投资建议。<br>'+
  '记录与持仓只存本机浏览器；行情每次打开页面实时拉取。均线源：'+esc(st.barSrc||"—")+'；资金历史接口不稳定时会显示“—”，此时“资金方向”只按当日净额判。'+'</footer>';

  var banner=$("banner");
  var now=new Date(), t=new Date(st.ts);
  if((now-t)>10*60000){
    banner.className="banner"; banner.style.display="block";
    banner.textContent="数据是 "+st.tsl+" 拉取的，已超过 10 分钟，点「刷新」取最新。";
  }
  document.getElementById("stampTxt").textContent="已同步 "+st.tsl;
  $("liveDot").className="dotlive";
}

/* ---------------- 5) 路由与交互 ---------------- */
var UI={};
var CURRENT=null;

UI.route=function(){
  var h=location.hash||"#/";
  if(h.indexOf("#/review")===0){ CURRENT=null; document.title="复盘 · 个股分析台"; viewReview(); return; }
  var m=h.match(/^#\/s\/([0-9A-Za-z]+)/);
  if(!m){ CURRENT=null; document.title="个股分析台"; viewHome(); return; }
  var code=m[1];
  var rec=DB.records.find(function(x){return x.code===code});
  if(!rec){ location.hash="#/"; return; }
  CURRENT=rec;
  document.title=rec.stock.name+" "+rec.code;
  viewStock(rec,true);
  UI.refresh(true);
};

UI.refresh=function(silent){
  if(!CURRENT) return;
  var rec=CURRENT;
  pullStock(rec.code).then(function(st){
    rec.stock=st;
    rec.analysis=analyze(st,rec.hold);
    upsert(rec);
    CURRENT=DB.records.find(function(x){return x.code===rec.code});
    viewStock(CURRENT,false);
  }).catch(function(e){
    if(!silent||!rec.stock) viewStock(rec,false,e.message);
    else {
      var b=$("banner");
      if(b){ b.className="banner err"; b.style.display="block"; b.textContent="刷新失败："+e.message+"（下面是上次的数据）"; }
    }
  });
};

UI.openPos=function(){
  var h=(CURRENT&&CURRENT.hold)||{};
  $("pHold").value=h.held?"yes":"no";
  $("pCost").value=h.cost||"";
  $("pQty").value=h.qty||"";
  $("pWeight").value=h.weight||"";
  $("maskPos").classList.add("show");
};
UI.closePos=function(){ $("maskPos").classList.remove("show"); };
UI.savePos=function(){
  var hold={
    held:$("pHold").value==="yes",
    cost:+$("pCost").value||0,
    qty:+$("pQty").value||0,
    weight:+$("pWeight").value||0
  };
  if(hold.held&&!hold.cost){ alert("持仓就填一下成本价"); return; }
  CURRENT.hold=hold;
  CURRENT.analysis=analyze(CURRENT.stock,hold);
  upsert(CURRENT);
  $("maskPos").classList.remove("show");
  viewStock(CURRENT,false);
};

function startAnalyze(code,hold){
  $("goMsg").textContent="正在拉取 "+code+" 的行情…";
  viewStock({code:code,stock:null},true);
  pullStock(code).then(function(st){
    var rec={
      code:st.code||code, stock:st,
      hold:hold||{held:false,cost:0,qty:0,weight:0},
      analysis:analyze(st,hold)
    };
    upsert(rec);
    location.hash="#/s/"+rec.code;
  }).catch(function(e){
    viewStock({code:code},false,e.message);
    setTimeout(function(){ location.hash="#/"; },10);
  });
}

document.addEventListener("click",function(e){
  var del=e.target.getAttribute&&e.target.getAttribute("data-del");
  if(del){
    e.stopPropagation();
    DB.records=DB.records.filter(function(x){return x.code!==del});
    saveDB(DB);
    if(location.hash.indexOf("#/s/")===0) location.hash="#/"; else viewHome();
    return;
  }
  var card=e.target.closest&&e.target.closest(".rec");
  if(card){ location.hash="#/s/"+card.getAttribute("data-code"); }
});
window.addEventListener("hashchange",function(){ UI.route(); });

/* 启动 */
UI.route();
window.UI=UI;
window.startAnalyze=startAnalyze;
</script>
